apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
  labels:
    service: load
spec:
  replicas: 1
  selector:
    matchLabels:
      service: load
  template:
    metadata:
      labels:
        service: load
    spec:
      containers:
      - name: load
        env:
          - name: HOST
            value: "http://web:8080/"
          # 🚨 AGGRESSIVE LOAD: Increased clients to trigger OOM within 2 minutes
          - name: NUM_CLIENTS
            value: "50"
          - name: RUN_TIME
            value: "2m"
          - name: SILENT
            value: "0"
          - name: ERROR
            value: "0"
        image: robotshop/rs-load:latest
        resources:
          limits:
            cpu: 200m
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 100Mi
