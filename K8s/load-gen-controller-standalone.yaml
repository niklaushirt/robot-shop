---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: robot-shop
  namespace: robot-shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: robot-shop-load-gen
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: robot-shop-load-gen
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: robot-shop-load-gen
subjects:
- kind: ServiceAccount
  name: robot-shop
  namespace: robot-shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-gen-controller
  namespace: robot-shop
  labels:
    service: load-gen-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      service: load-gen-controller
  template:
    metadata:
      labels:
        service: load-gen-controller
    spec:
      serviceAccountName: robot-shop
      containers:
      - name: load-gen-controller
        image: quay.io/arthurdm-quay/itom/rs-load-gen-controller:latest
        imagePullPolicy: Always
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: LOAD_GEN_IMAGE
          value: quay.io/arthurdm-quay/itom/rs-load:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: load-gen-controller
  namespace: robot-shop
  labels:
    service: load-gen-controller
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    service: load-gen-controller

