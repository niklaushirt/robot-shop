apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-recommendations
  labels:
    service: checkout-recommendations
    demo: memory-leak
spec:
  replicas: 1
  selector:
    matchLabels:
      service: checkout-recommendations
  template:
    metadata:
      labels:
        service: checkout-recommendations
        demo: memory-leak
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: checkout-recommendations
        image: quay.io/arthurdm-quay/rs-checkout-recommendations:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: INSTANA_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: WATSONX_API_KEY
          valueFrom:
            secretKeyRef:
              name: watsonx-credentials
              key: api-key
              optional: true
        - name: WATSONX_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: watsonx-credentials
              key: project-id
              optional: true
        - name: WATSONX_URL
          value: https://us-south.ml.cloud.ibm.com
        - name: CATALOGUE_HOST
          value: catalogue
        - name: CART_HOST
          value: cart
        - name: RATINGS_HOST
          value: ratings
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-recommendations
  labels:
    service: checkout-recommendations
    demo: memory-leak
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    service: checkout-recommendations

