version: '3'
services:
  load:
    image: ${REPO}/rs-load:${TAG}
    build:
      context: load-gen
    environment:
      HOST: http://web:8080
      # 🚨 AGGRESSIVE LOAD: High concurrency to trigger OOM within 2 minutes
      NUM_CLIENTS: 50
      RUN_TIME: 2m
      SILENT: 0
      ERROR: 0
    networks:
      - robot-shop
    depends_on:
      - web
    logging: &logging
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "2"
