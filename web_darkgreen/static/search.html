<!-- search template -->
<div class="search-page">
    <div class="page-heading">
        <span class="eyebrow"><span></span> Catalogue search</span>
        <h2>Search results</h2>
    </div>
    <div ng-if="data.searchResults.length == 0">
        <div class="empty-state">Nothing matched your search. Try another robot name or category.</div>
    </div>
    <div ng-if="data.searchResults.length != 0">
        <h3>These excellent candidates match your search</h3>
        <table>
            <tr ng-repeat="item in data.searchResults">
                <td><a class="product" href="/product/{{ item.sku }}">{{ item.name }}</a></td>
                <td>{{ item.description }}</td>
                <td>&euro;{{ item.price }}</td>
            </tr>
        </table>
    </div>
</div>
